model_name: "/models/Qwen3-ASR-1.7B-MTP5-stage2-3384"
model_type: "vllm-asr"
hardware: "Ascend 310P"

serve:
  tensor_parallel_size: 1
  dtype: bfloat16
  max_model_len: 8192
  gpu_memory_utilization: 0.8
  trust_remote_code: false
  speculative_config:
    method: mtp
    num_speculative_tokens: 5

tasks:
  - name: "librispeech_test_clean"
    dataset: "openslr/librispeech_asr"
    split: "test"
    dataset_config: "clean"
    metrics:
      - name: "wer"
        value: 0.035

num_fewshot: 0
limit: 500
